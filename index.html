<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>OCTA · WHIRL · GEO · 81</title>

<style>
body { background:#000; color:#0f0; font-family:monospace; padding:40px; }
h1 { color:#6cf; text-align:center; }

/* GEO-KREIS */
#geo {
    width: 360px;
    height: 360px;
    margin: 40px auto;
    border: 3px solid #6cf;
    border-radius: 50%;
    position: relative;
    animation: spin 18s cubic-bezier(0.42, 0, 0.58, 1) infinite;
    box-shadow: 0 0 25px #6cf;
}

/* DOTS */
.dot {
    width: 12px;
    height: 12px;
    background:#0f0;
    border-radius:50%;
    position:absolute;
    transition:0.3s;
    box-shadow:0 0 10px #0f0;
}

/* ACHSEN */
.axis {
    position:absolute;
    width:2px;
    height:360px;
    background:#333;
    left:179px;
    top:0;
    transform-origin:bottom;
}

/* INFO PANEL */
pre {
    background:#111;
    padding:20px;
    border-left:3px solid #6cf;
    white-space:pre-wrap;
    box-shadow:0 0 15px #6cf;
}
</style>
</head>

<body>

<h1>OCTA · WHIRL · GEO‑Vektor</h1>

<div id="geo"></div>

<pre id="info">Lade WHIRL.json…</pre>

<script>
(async function(){

    const info = document.getElementById("info");

    try {
        const whirl = await fetch("WHIRL.json").then(r => r.json());

        info.innerText =
            "WHIRL geladen ✓\n" +
            "Vektor: " + whirl.vector + "\n" +
            "Felder: " + whirl.fields + "\n" +
            "Geo: " + whirl.geo + "\n" +
            "Module: " + whirl.routes.length + "\n";

        const geo = document.getElementById("geo");
        const count = whirl.fields;
        const radius = 160;

        /* OCTA-ACHSEN (8 Achsen) */
        for(let a=0; a<8; a++){
            const axis = document.createElement("div");
            axis.className = "axis";
            axis.style.transform = `rotate(${a * 45}deg)`;
            geo.appendChild(axis);
        }

        /* DOTS ERZEUGEN */
        for(let i=0; i<count; i++){
            const dot = document.createElement("div");
            dot.className = "dot";

            const angle = (i / count) * Math.PI * 2;
            const x = Math.cos(angle) * radius + 180 - 6;
            const y = Math.sin(angle) * radius + 180 - 6;

            dot.style.left = x + "px";
            dot.style.top = y + "px";

            /* WHIRL-ENERGIE → DOT-Farbe */
            const energy = whirl.vector[i % whirl.vector.length];
            const hue = (energy * 36) % 360;
            dot.style.background = `hsl(${hue}, 100%, 50%)`;
            dot.style.boxShadow = `0 0 12px hsl(${hue}, 100%, 50%)`;

            geo.appendChild(dot);
        }

    } catch(e){
        info.innerText = "WHIRL → Fehler\n" + e.toString();
    }

})();
</script>

</body>
</html>
